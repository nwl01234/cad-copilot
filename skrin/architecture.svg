<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  </defs>
  <rect width="880" height="500" fill="#ffffff"/>
  <text x="40" y="34" font-family="Segoe UI" font-size="20" font-weight="700" fill="#0f172a">Пайплайн CAD Copilot</text>
  <text x="40" y="56" font-family="Segoe UI" font-size="12" fill="#64748b">язык → модель плана (СПДС) → DXF / SVG / G-code / AutoCAD</text>

  <rect x="40" y="80" width="210" height="130" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="40" y="80" width="210" height="28" rx="10" fill="url(#hdr)"/><rect x="40" y="96" width="210" height="12" fill="url(#hdr)"/>
  <text x="145" y="99" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="600" fill="#fff">Ввод</text>
  <text x="52" y="130" font-family="Consolas" font-size="11" fill="#334155">"комната 4x5, кухня 3x3,</text>
  <text x="52" y="146" font-family="Consolas" font-size="11" fill="#334155"> ванная 2x3, 4 двери, 2 окна"</text>
  <text x="52" y="172" font-family="Segoe UI" font-size="11" fill="#64748b">parse_request(): regex + intent-модель</text>
  <text x="52" y="188" font-family="Segoe UI" font-size="11" fill="#64748b">spec = {rooms, doors, windows}</text>

  <rect x="310" y="80" width="240" height="130" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <rect x="310" y="80" width="240" height="28" rx="10" fill="#2563eb"/><rect x="310" y="96" width="240" height="12" fill="#2563eb"/>
  <text x="430" y="99" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="600" fill="#fff">core/model.py — план этажа</text>
  <text x="322" y="130" font-family="Segoe UI" font-size="11" fill="#334155">стены двумя линиями: EW 300 / IW 100 мм</text>
  <text x="322" y="146" font-family="Segoe UI" font-size="11" fill="#334155">проёмы 0.9/1.3 м + четверти</text>
  <text x="322" y="162" font-family="Segoe UI" font-size="11" fill="#334155">двери: дуга открывания; окна: стекло</text>
  <text x="322" y="178" font-family="Segoe UI" font-size="11" fill="#334155">размерные цепочки + засечки</text>
  <text x="322" y="194" font-family="Segoe UI" font-size="11" fill="#334155">экспликация по ГОСТ 21.501</text>

  <rect x="640" y="60" width="220" height="52" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="656" y="84" font-family="Consolas" font-size="12" font-weight="700" fill="#15803d">render_dxf() → DXF R12</text>
  <text x="656" y="100" font-family="Segoe UI" font-size="11" fill="#475569">слои+цвета (TABLES), ARC, cp1251</text>
  <rect x="640" y="122" width="220" height="52" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="656" y="146" font-family="Consolas" font-size="12" font-weight="700" fill="#15803d">render_svg() → SVG</text>
  <text x="656" y="162" font-family="Segoe UI" font-size="11" fill="#475569">превью + /api/preview + GIF</text>
  <rect x="640" y="184" width="220" height="52" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="656" y="208" font-family="Consolas" font-size="12" font-weight="700" fill="#15803d">generate_gcode() → ЧПУ</text>
  <text x="656" y="224" font-family="Segoe UI" font-size="11" fill="#475569">G21/G90, мм, Z между контурами</text>

  <rect x="310" y="250" width="550" height="150" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="326" y="278" font-family="Segoe UI" font-size="14" font-weight="700" fill="#c2410c">Интеграция с AutoCAD — 3 пути</text>
  <text x="326" y="302" font-family="Segoe UI" font-size="11" fill="#334155"><tspan font-weight="600">1. COM (acad_bridge.py):</tspan> запущенный AutoCAD/BricsCAD/ZWCAD -></text>
  <text x="340" y="318" font-family="Segoe UI" font-size="11" fill="#475569">AddLine/AddArc/AddText в активный док, слои с цветами, ZoomExtents</text>
  <text x="326" y="342" font-family="Segoe UI" font-size="11" fill="#334155"><tspan font-weight="600">2. SCR (acad_scr.py):</tspan> .scr для командной строки: OPEN + ZOOM E +</text>
  <text x="340" y="358" font-family="Segoe UI" font-size="11" fill="#475569">SAVEAS DWG / -PLOT в PDF; батч без GUI через accoreconsole.exe</text>
  <text x="326" y="382" font-family="Segoe UI" font-size="11" fill="#334155"><tspan font-weight="600">3. DXF-файл:</tspan> out/plan.dxf открывается напрямую во всех CAD</text>

  <rect x="40" y="420" width="820" height="54" rx="10" fill="#fafaf9" stroke="#e7e5e4"/>
  <text x="56" y="443" font-family="Segoe UI" font-size="12" font-weight="600" fill="#0f172a">FastAPI (app.py)</text>
  <text x="56" y="460" font-family="Consolas" font-size="11" fill="#64748b">POST /api/generate (план+area) · GET /api/preview · GET /api/scr · POST /api/gcode · POST /api/import · GET /health</text>

  <line x1="250" y1="145" x2="306" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="550" y1="120" x2="636" y2="88" stroke="#22c55e" stroke-width="2"/>
  <line x1="550" y1="135" x2="636" y2="148" stroke="#22c55e" stroke-width="2"/>
  <line x1="550" y1="150" x2="636" y2="210" stroke="#22c55e" stroke-width="2"/>
  <line x1="770" y1="250" x2="770" y2="242" stroke="#f97316" stroke-width="2"/>
  <text x="40" y="494" font-family="Segoe UI" font-size="11" fill="#94a3b8">Ядра: core/finetune.py (обучение intent-классификатора на CPU), core/qa.py (honeypot/consistency), core/dxf_import.py (импорт и правка DXF обратно)</text>
</svg>
